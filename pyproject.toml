[project]
name = "article-to-video"
version = "0.1.0"
description = "把財經文章做成解說影片的 Claude Code 外掛（財經圖表、zh-TW AI 配音）"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "certifi>=2024",
    "edge-tts>=7,<8",
    "numpy>=2.4.6",
    "pdfminer-six>=20260107",
    "pillow>=12.3.0",
    "playwright==1.63.0",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
